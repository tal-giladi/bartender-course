- id: caipirinha
  name: Caipirinha
  family: sour
  method: build
  glass: double old fashioned glass
  ice: crushed
  garnish: "none in the IBA spec"
  ingredients:
    - {item: cachaça, ml: 60}
    - {item: "lime, cut into small wedges", amount: 1 lime}
    - {item: white cane sugar, amount: 4 teaspoons}
  source: {title: "IBA — Caipirinha", url: "https://iba-world.com/iba-cocktail/caipirinha/"}
  lesson: "06.5"
  na_analogue: "1 lime muddled with 4 tsp sugar, crushed ice, topped with soda water"
  notes: "Muddle lime and sugar gently in the glass, fill with cracked ice, add cachaça, stir gently."
  variations:
    - name: Caipiroska / Caipirissima / Caipirão (IBA note)
      spec: "same build with vodka (Caipiroska), rum (Caipirissima) or Licor Beirão (Caipirão) instead of cachaça"
      source: {title: "IBA — Caipirinha", url: "https://iba-world.com/iba-cocktail/caipirinha/"}

- id: cuba-libre
  name: Cuba Libre
