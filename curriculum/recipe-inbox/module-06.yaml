- id: pisco-sour
  name: Pisco Sour
  family: sour
  method: shake
  glass: goblet (chilled)
  ice: none
  garnish: "a few drops of Amargo bitters (or Angostura) on the foam"
  ingredients:
    - {item: pisco, ml: 60}
    - {item: fresh lemon juice, ml: 30}
    - {item: simple syrup 1:1, ml: 20}
    - {item: "egg white (pasteurised) or aquafaba", amount: "1 white (about 30 ml)"}
  source: {title: "IBA — Pisco Sour", url: "https://iba-world.com/iba-cocktail/pisco-sour/"}
  lesson: "06.2"
  na_analogue: "white grape juice cut 1:1 with water (60 ml), 25 ml lemon, 10 ml 1:1 syrup, 30 ml aquafaba, reverse dry shaken, cinnamon-tea drops on top"
  notes: "IBA lists a raw egg white; the course uses pasteurised egg white or aquafaba and tells the guest."
  variations:
    - name: Pisco Sour (Difford's Guide)
      spec: "60 ml pisco, 15 ml lime, 7.5 ml lemon, 15 ml 2:1 syrup, 20 ml pasteurised egg white, optional 2.5 ml orange blossom water and 3 drops saline; shake, strain back, dry shake, fine strain, chilled coupe; 3 drops Amargo Chuncho or Angostura"
      source: {title: "Difford's Guide — Pisco Sour (Difford's recipe)", url: "https://www.diffordsguide.com/cocktails/recipe/1563/pisco-sour"}

- id: french-75
  name: French 75
  family: spritz-sparkling
  method: shake
  glass: Champagne flute (chilled)
  ice: none
  garnish: "none in the IBA spec (lemon twist common)"
  ingredients:
    - {item: gin, ml: 30}
    - {item: fresh lemon juice, ml: 15}
    - {item: sugar syrup 1:1, ml: 15}
    - {item: Champagne (brut), ml: 60}
  source: {title: "IBA — French 75", url: "https://iba-world.com/iba-cocktail/french-75/"}
  lesson: "06.3"
  na_analogue: "alcohol-free gin alternative or juniper tea with 15 ml lemon and 15 ml syrup, shaken, topped with alcohol-free sparkling wine or dry sparkling grape juice"
  notes: "Shake all but the Champagne, strain into the flute, top with Champagne, stir gently."
  variations:
    - name: French 75 (Difford's Guide)
      spec: "45 ml London dry gin, 15 ml lemon, 1.5 bar spoons powdered sugar (or about 7.5 ml 2:1 syrup), 75 ml brut sparkling wine; dissolve sugar in lemon, add gin, shake, fine strain into a chilled flute, top; lemon twist"
      source: {title: "Difford's Guide — French 75", url: "https://www.diffordsguide.com/cocktails/recipe/790/french-75"}

- id: tom-collins
  name: Tom Collins
  family: collins-fizz
  method: build
  glass: highball (Collins) glass
  ice: collins-cubes
  garnish: "lemon slice and maraschino cherry"
  ingredients:
    - {item: Old Tom gin, ml: 45}
    - {item: fresh lemon juice, ml: 30}
    - {item: simple syrup 1:1, ml: 15}
    - {item: soda water, ml: 60}
  source: {title: "IBA — John Collins (note: use Old Tom gin for Tom Collins)", url: "https://iba-world.com/iba-cocktail/john-collins/"}
  lesson: "06.3"
  na_analogue: "alcohol-free gin alternative (or juniper or rosemary tea), 30 ml lemon, 15 ml syrup, built over ice, 60 ml soda"
  notes: "No IBA Tom Collins page exists; the IBA John Collins with London dry gin is the same spec."
  variations:
    - name: Tom Collins (Difford's Guide)
      spec: "52.5 ml Old Tom gin, 22.5 ml lemon, 15 ml 2:1 syrup, 52.5 ml soda; shake first three, strain into an ice-filled Collins glass, top with soda, stir briefly; orange wheel and cherry"
      source: {title: "Difford's Guide — Tom Collins", url: "https://www.diffordsguide.com/cocktails/recipe/1972/tom-collins"}

- id: paloma
  name: Paloma
  family: highball
  method: build
  glass: highball glass
  ice: cubes
  garnish: "lime slice"
  ingredients:
    - {item: tequila (100% agave), ml: 50}
    - {item: fresh lime juice, ml: 5}
    - {item: salt, amount: a pinch}
    - {item: pink grapefruit soda, ml: 100}
  source: {title: "IBA — Paloma", url: "https://iba-world.com/iba-cocktail/paloma/"}
  lesson: "06.3"
  na_analogue: "fresh grapefruit juice and lime with a pinch of salt, topped with grapefruit soda or soda water"
  variations:
