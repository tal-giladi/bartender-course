      source: {title: "Difford's Guide — Paloma", url: "https://www.diffordsguide.com/cocktails/recipe/1456/paloma"}

- id: bloody-mary
  name: Bloody Mary
  family: savory
  method: stir
  glass: rocks glass (highball with ice if requested)
  ice: none
  garnish: "celery stick, lemon wedge (optional)"
  ingredients:
    - {item: vodka, ml: 45}
    - {item: tomato juice, ml: 90}
    - {item: fresh lemon juice, ml: 15}
    - {item: Worcestershire sauce, amount: 2 dashes}
    - {item: "Tabasco, celery salt, black pepper", amount: to taste}
  source: {title: "IBA — Bloody Mary", url: "https://iba-world.com/iba-cocktail/bloody-mary/"}
  lesson: "06.4"
  na_analogue: "Virgin Mary: 120 ml tomato juice, 15 ml lemon, same seasoning, stirred or rolled"
  notes: "Stir gently in a mixing glass with ice and pour into a rocks glass; highball with ice on request. Allergens: Worcestershire lists anchovies (fish) and barley; celery salt contains celery."
  variations:
    - name: Bloody Mary (Difford's Guide)
      spec: "60 ml vodka, 120 ml tomato juice, 15 ml lemon, 8 drops hot pepper sauce, 4 dashes Worcestershire, 2 grinds black pepper, a pinch of celery salt; roll with ice, strain into an ice-filled Collins glass with a salt rim; celery stick and skewered cherry tomato, gherkin and cocktail onion"
      source: {title: "Difford's Guide — Bloody Mary", url: "https://www.diffordsguide.com/cocktails/recipe/251/bloody-mary"}

- id: mai-tai
  name: Mai Tai
  family: tiki-punch
  method: shake
  glass: double rocks glass or highball
  ice: cubes
  garnish: "pineapple spear, mint leaves and lime peel"
  ingredients:
    - {item: amber Jamaican rum, ml: 30}
    - {item: Martinique molasses rum, ml: 30}
    - {item: orange curaçao, ml: 15}
    - {item: orgeat (almond) syrup, ml: 15}
    - {item: fresh lime juice, ml: 30}
    - {item: simple syrup 1:1, ml: 7.5}
  source: {title: "IBA — Mai Tai", url: "https://iba-world.com/iba-cocktail/mai-tai/"}
  lesson: "06.4"
  na_analogue: "30 ml lime, 15 ml orgeat, 30 ml pineapple juice, 30 ml orange juice, 30 ml cold black tea, shaken, crushed ice, mint and pineapple (contains almond)"
  notes: "IBA: shake and pour into a double rocks or highball glass. Allergen: orgeat contains almonds (tree nuts). No flaming garnishes."
  variations:
    - name: Mai Tai, Trader Vic's (Difford's Guide)
      spec: "60 ml aged rum, 15 ml dry curaçao, 22.5 ml lime, 10 ml 2:1 orgeat, 7.5 ml 2:1 syrup, optional 5 ml dark rum float; shake, strain into a double old-fashioned glass filled with crushed ice; lime shell, mint sprigs, pineapple and cherry"
      source: {title: "Difford's Guide — Mai Tai (Trader Vic's)", url: "https://www.diffordsguide.com/cocktails/recipe/1219/mai-tai"}

