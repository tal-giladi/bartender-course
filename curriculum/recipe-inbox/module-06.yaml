- id: penicillin
  name: Penicillin
  family: sour
  method: shake
  glass: old fashioned glass (chilled)
  ice: cubes
  garnish: "candied ginger"
  ingredients:
    - {item: blended Scotch whisky, ml: 60}
    - {item: fresh lemon juice, ml: 22.5}
    - {item: honey syrup, ml: 22.5}
    - {item: fresh ginger, amount: 2-3 quarter-size slices}
    - {item: "Islay single malt (Lagavulin 16), floated", ml: 7.5}
  source: {title: "IBA — Penicillin", url: "https://iba-world.com/iba-cocktail/penicillin/"}
  lesson: "06.5"
  na_analogue: "muddled ginger, 60 ml cold black tea, 22.5 ml lemon, 22.5 ml honey syrup, shaken, fine strained over ice, float of smoked (lapsang souchong) tea"
  notes: "Muddle ginger in the shaker, add all but the Islay malt, shake, fine strain over ice, float the malt."
  variations:
    - name: Penicillin (Difford's Guide, 2009 version)
      spec: "45 ml blended Scotch, 15 ml ginger liqueur, 10 ml peated single malt, 20 ml lemon, 20 ml honey syrup (3:1 by weight); shake, strain over ice (large cube); crystallised ginger"
      source: {title: "Difford's Guide — Penicillin", url: "https://www.diffordsguide.com/cocktails/recipe/2539/penicillin"}

