# Module 06 recipes — IBA specs checked on iba-world.com 2026-10-17 (canonical URLs iba-world.com/iba-cocktail/<name>/).
# Non-IBA drinks (Tom Collins via the IBA John Collins note, Gimlet, Hugo Spritz, arak serves) name their own source.
# Variations are listed with their own source; they are not the default spec.
# Ingredient amounts: ml as numbers; dashes, pieces, leaves, pinches and "to top" as amount strings.
# Ids checked against curriculum/recipe-inbox/module-05.yaml: no clash.

- id: white-lady
  name: White Lady
  family: sour
  method: shake
  glass: cocktail glass (chilled)
  ice: none
  garnish: "none in the IBA spec (lemon twist common)"
  ingredients:
    - {item: gin, ml: 40}
    - {item: triple sec, ml: 30}
    - {item: fresh lemon juice, ml: 20}
  source: {title: "IBA — White Lady", url: "https://iba-world.com/iba-cocktail/white-lady/"}
  lesson: "06.2"
  na_analogue: "alcohol-free gin alternative or juniper-lemon tea, 25 ml orange juice, 10 ml 1:1 syrup, 20 ml lemon, shaken"
  variations:
    - name: White Lady (Difford's Guide)
      spec: "50 ml London dry gin, 22.5 ml triple sec, 22.5 ml lemon, 7.5 ml 2:1 syrup (optional), 15 ml pasteurised egg white, optional saline and orange flower water; shake, strain back, dry shake, fine strain, chilled coupe; lemon twist"
      source: {title: "Difford's Guide — White Lady", url: "https://www.diffordsguide.com/cocktails/recipe/2091/white-lady"}

- id: sidecar
  name: Sidecar
  family: sour
  method: shake
  glass: cocktail glass (chilled)
  ice: none
  garnish: "none in the IBA spec (orange or lemon twist common)"
  ingredients:
    - {item: cognac, ml: 50}
    - {item: triple sec, ml: 20}
    - {item: fresh lemon juice, ml: 20}
  source: {title: "IBA — Sidecar", url: "https://iba-world.com/iba-cocktail/sidecar/"}
  lesson: "06.2"
  na_analogue: "50 ml cold rooibos or black tea with a few drops of vanilla, 20 ml orange juice, 10 ml 1:1 syrup, 20 ml lemon, shaken"
