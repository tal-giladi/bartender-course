- id: q1
  question: >-
    A guest asks why the wine list tops out around 15% while the spirits are 40%. What is the
    accurate short answer?
  options:
    - Wine is diluted with water before bottling, while spirits are bottled straight from the cask.
    - Yeast stops working at around 14-16% alcohol, so spirits need distillation to go higher.
    - Grapes contain less sugar than grain, so wine can never reach the strength of a spirit.
    - Spirits are fermented for years in barrels, which slowly raises their alcohol level.
  correct: 1
  explanation: >-
    Fermentation alone stops when the alcohol becomes too strong for the yeast, usually around
    14-16%. Distillation separates alcohol from water to reach spirit strength; barrels age a spirit
    but do not raise its alcohol.
- id: q2
  question: >-
    Your bar pours 45 ml of a 40% spirit. Using the Israeli Ministry of Health standard drink of
    about 14 g, how many standard drinks is that?
  options:
    - About 1.3, because 45 ml times 0.40 gives 18 standard drink units.
    - About 0.5, because a standard drink is 30 ml of pure alcohol.
    - About 1.0, because 45 times 0.40 times 0.789 is about 14 g.
    - About 3.2, because 45 ml divided by 14 g gives the number of drinks.
  correct: 2
  explanation: >-
    45 ml x 0.40 = 18 ml of ethanol; 18 x 0.789 = about 14.2 g, which is about one 14 g standard
    drink. Skipping the 0.789 or dividing ml by grams gives wrong answers.
- id: q3
  question: >-
    A bottle from the US is labelled "90 proof". A colleague says it is 90% alcohol and must not be
    used. What do you tell them?
  options:
    - US proof is twice the ABV, so it is 45% and normal for a spirit.
    - US proof equals the ABV, so the colleague is right to put it aside.
    - US proof is ABV plus 50, so it is 40% and a standard strength.
    - Proof measures sugar, not alcohol, so the strength is not shown.
  correct: 0
  explanation: >-
    On US labels proof = 2 x ABV, so 90 proof = 45% ABV. Israeli and European labels show % vol
    instead.
- id: q4
  question: >-
    You mix 60 ml of 40% gin with 120 ml of tonic and no ice melt. What is the drink's ABV?
  options:
    - 40%, because the gin keeps its strength in the glass.
    - 20%, because half of the drink's ingredients are alcoholic.
    - About 33%, because 60 out of 180 ml is gin.
    - About 13%, because 24 ml of alcohol is spread through 180 ml.
  correct: 3
  explanation: >-
    Alcohol = 60 x 0.40 = 24 ml. Total volume = 180 ml. ABV = 24 / 180 = about 13.3%. The share
    of gin (33%) is not the share of alcohol.
- id: q5
  question: >-
    In the home fermentation demo, bottle A (sugar and yeast) inflates its balloon and bottle B
    (yeast only) does not. What does bottle B show?
  options:
    - That the water in bottle B was too hot and killed the yeast.
    - That yeast needs sugar to ferment and make CO2.
    - That the alcohol stayed in bottle B instead of becoming gas.
    - That fermentation only works in a sealed bottle without air.
  correct: 1
  explanation: >-
    Bottle B is the control: same yeast and water, no sugar. Without sugar there is nothing to
    ferment, so no CO2 inflates the balloon.
